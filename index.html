<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Visualizers — Hans Sai</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#050506; color:#e8e6df;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { padding:56px 24px 40px; max-width:1200px; margin:0 auto; }
  .kicker { font-size:11px; letter-spacing:.22em; color:#6b6f7a; text-transform:uppercase; }
  h1 { font-size:clamp(26px,4vw,40px); font-weight:600; letter-spacing:-.02em; margin-top:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:2px; background:#0c0d11; }
  .card { position:relative; display:block; aspect-ratio:16/10; overflow:hidden;
    text-decoration:none; color:inherit; background:#0a0a0d; }
  .card img { width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .6s ease; }
  .card:hover img { transform:scale(1.04); }
  .card .label { position:absolute; left:0; right:0; bottom:0; padding:20px;
    background:linear-gradient(transparent,rgba(0,0,0,.75)); }
  .card .no { font-size:10px; letter-spacing:.2em; color:#9a9ea8; }
  .card h2 { font-size:20px; margin-top:6px; letter-spacing:-.01em; }
  footer { padding:40px 24px; text-align:center; font-size:11px;
    letter-spacing:.1em; color:#55565e; }
</style>
</head>
<body>
<header>
  <div class="kicker">Hans Sai</div>
  <h1>Audio Visualizers</h1>
</header>
<div class="grid">
  <a class="card" href="flux/">
    <img src="flux/thumb.jpg" alt="Flux visualizer">
    <div class="label"><div class="no">№ 01</div><h2>Flux</h2></div>
  </a>
  <a class="card" href="kaleido/">
    <img src="kaleido/thumb.jpg" alt="Kaleido visualizer">
    <div class="label"><div class="no">№ 02</div><h2>Kaleido</h2></div>
  </a>
</div>
<footer>sound into light</footer>
</body>
</html>
